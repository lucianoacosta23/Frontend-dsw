<div
  class="carousel"
  role="region"
  aria-label="Álbumes populares"
  aria-roledescription="carrusel"
  (mouseenter)="hover(true)"
  (mouseleave)="hover(false)"
  (focusin)="focus()"
  (focusout)="blur($event)"
>
  <div #rail class="rail">
    <div class="track">
      <div #originals class="group" role="list">
        @for (album of albums; track album.id; let position = $index) {
          <ng-container
            [ngTemplateOutlet]="card"
            [ngTemplateOutletContext]="{ $implicit: album, position }"
          />
        }
      </div>
      @if (overflow()) {
        <div class="group copy" role="list">
          @for (album of albums; track album.id; let position = $index) {
            <ng-container
              [ngTemplateOutlet]="card"
              [ngTemplateOutletContext]="{ $implicit: album, position }"
            />
          }
        </div>
      }
    </div>
  </div>
</div>
<ng-template #card let-album let-position="position">
  <div class="item" role="listitem">
    <a
      class="card"
      [routerLink]="directNavigation ? ['/releases', album.id] : ['/login']"
      [queryParams]="directNavigation ? null : { returnUrl: '/releases/' + album.id }"
      [attr.aria-label]="'Ver ' + album.name"
    >
      <div class="art">
        <app-release-cover
          [src]="album.imageUrl"
          [alt]="'Portada de ' + album.name"
          effect="interactive"
        />
        <span class="rank">#{{ position + 1 }}</span>
      </div>
      <h3>{{ album.name }}</h3>
      <p class="artist">{{ artists(album) }}</p>
    </a>
  </div>
</ng-template>
