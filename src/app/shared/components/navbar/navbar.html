<header class="site-header">
  <nav class="navbar" aria-label="Navegación principal">
    <a class="brand" routerLink="/dashboard">
      <span class="brand-mark" aria-hidden="true">♫</span>
      Jukeboxd
    </a>

    @if (auth.currentUser(); as user) {
      <div class="nav-actions">
        <!-- details permite abrir el menú con mouse o teclado. -->
        <details class="user-menu">
          <summary>{{ user.username }}</summary>

          <div class="dropdown">
            <a routerLink="/dashboard">Inicio</a>
            <a routerLink="/profile">Mi perfil</a>

            <button
              type="button"
              [disabled]="loggingOut()"
              (click)="logout()"
            >
              {{ loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
            </button>
          </div>
        </details>

                <a
          class="icon-button"
          routerLink="/activity"
          aria-label="Actividad"
          title="Actividad"
        >
          <span aria-hidden="true">ϟ</span>
        </a>

                <a
          class="icon-button"
          routerLink="/search"
          aria-label="Buscar"
          title="Buscar"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="10" cy="10" r="6"></circle>
            <path d="m15 15 6 6"></path>
          </svg>
        </a>

        <!-- Solo ADMIN ve esta opción. -->
        @if (user.category === 'ADMIN') {
          <button
            class="admin-button"
            type="button"
            disabled
            title="Administración: próximamente"
          >
            Administrar
          </button>
        }
      </div>
    }
  </nav>

  @if (logoutError(); as message) {
    <p class="logout-error" role="alert">{{ message }}</p>
  }
</header>
